<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floor Plans</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI','David',Arial,sans-serif;background:#f5f5f0;color:#222;line-height:1.6}
    header{background:#1a3a2a;color:#fff;padding:1.2rem 2rem}
    header h1{font-size:1.35rem} header p{font-size:.88rem;opacity:.9;margin-top:.3rem}
    .plan-tabs{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem 2rem 0;background:#e8f5e9}
    .plan-tabs button{padding:.55rem 1.1rem;border:2px solid #81c784;background:#fff;border-radius:8px 8px 0 0;cursor:pointer;font-family:inherit;font-size:.9rem}
    .plan-tabs button.active{background:#1a3a2a;color:#fff;border-color:#1a3a2a;font-weight:600}
    main{max-width:1150px;margin:0 auto;padding:1rem 1.5rem 2rem}
    .note-box{background:#fff8e1;border-right:4px solid #f9a825;padding:.9rem 1rem;border-radius:6px;margin-bottom:1rem;font-size:.88rem}
    .note-box strong{color:#e65100}
    .controls{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;align-items:center}
    .controls button{padding:.45rem .9rem;border:2px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:.85rem;font-family:inherit}
    .controls button.active{border-color:#1a3a2a;background:#e8f5e9;font-weight:600}
    .plan-wrap{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:auto;padding:.8rem}
    svg{display:block;max-width:100%;height:auto}
    .legend{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1rem;font-size:.82rem}
    .legend span{display:flex;align-items:center;gap:.35rem}
    .swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
    .info-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-top:1.2rem}
    .card{background:#fff;border-radius:8px;padding:.9rem;border-right:4px solid #ccc;box-shadow:0 1px 5px rgba(0,0,0,.06)}
    .card h3{font-size:.95rem;margin-bottom:.35rem} .card p{font-size:.82rem;color:#555}
    .card.p0{border-color:#6a1b9a}.card.u1{border-color:#1565c0}.card.u2{border-color:#2e7d32}
    .card.u3{border-color:#e65100}.card.u4{border-color:#00838f}
    .plan-panel{display:none}.plan-panel.active{display:block}
    footer{text-align:center;padding:1.2rem;font-size:.78rem;color:#888}
  </style>
</head>
<body>

Object.keys(legends).forEach(function(p){
  var leg=document.getElementById('leg-'+p);if(!leg)return;
  legends[p].forEach(function(item){
    var border=item.length>2&&typeof item[item.length-1]==='string'&&item[item.length-1].charAt(0)==='#'&&typeof item[item.length-2]==='string'&&item[item.length-2].charAt(0)==='#'?item.pop():null;
    var color=item.pop();var label=u.apply(null,item);
    var sp=document.createElement('span');
    var swStyle=border?'background:'+color+';box-shadow:inset 0 0 0 2px '+border:'background:'+color;
    sp.innerHTML='<span class="swatch" style="'+swStyle+'"></span> '+label;
    leg.appendChild(sp);
  });
});

document.querySelectorAll('.plan-tabs button').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.plan-tabs button').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.plan-panel').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active');document.getElementById('panel-'+btn.dataset.plan).classList.add('active');
  });
});
document.querySelectorAll('.controls button').forEach(function(btn){
  btn.addEventListener('click',function(){
    var plan=btn.dataset.plan,panel=document.getElementById('panel-'+plan);
    panel.querySelectorAll('.controls button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');var layer=btn.dataset.layer,svg=panel.querySelector('.plan-svg');
    var infra=['infra','entrances','windows'],base=['yard-top','yard-side'];
    svg.querySelectorAll('g[id]').forEach(function(g){
      var id=g.id;
      if(layer==='all'){g.style.opacity='1';return;}
      if(layer==='infra'&&infra.indexOf(id)>=0){g.style.opacity='1';return;}
      if(layer==='infra'){g.style.opacity=base.indexOf(id)>=0?'0.4':'0.15';return;}
      if(layer==='u0'&&id.indexOf('unit0')===0){g.style.opacity='1';return;}
      if(layer==='u1'&&id.indexOf('unit1')===0){g.style.opacity='1';return;}
      if(layer==='u2'&&id.indexOf('unit2')===0){g.style.opacity='1';return;}
      if(layer==='u3'&&id.indexOf('unit3')===0){g.style.opacity='1';return;}
      if(layer==='u4'&&id.indexOf('unit4')===0){g.style.opacity='1';return;}
      if(base.indexOf(id)>=0||infra.indexOf(id)>=0||id==='walls-new'){g.style.opacity='0.35';}
      else{g.style.opacity='0.1';}
    });
  });
});
</script>
